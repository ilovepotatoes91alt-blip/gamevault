
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameVault — Play Beyond Limits</title>
<style>
:root{--bg:#080b14;--panel:#111827;--line:#253047;--cyan:#52f7ff;--purple:#a78bfa;--muted:#9ba9c3}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#17213b 0%,var(--bg) 55%);color:#f4f7ff;font:16px system-ui,Arial,sans-serif;min-height:100vh}
header{padding:30px 6%;border-bottom:1px solid var(--line);background:#080b14cc}
.logo{font-size:28px;font-weight:900;letter-spacing:2px}.logo span{color:var(--cyan)}
header p{color:var(--muted);margin:5px 0 0}
main{max-width:1200px;margin:auto;padding:28px 20px}
.hero{padding:25px 0 30px}.hero h1{font-size:clamp(32px,6vw,58px);line-height:1.05;margin:0 0 12px}.hero h1 span{color:var(--cyan)}
.hero p{color:var(--muted);max-width:600px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.stat{background:var(--panel);border:1px solid var(--line);padding:12px 17px;border-radius:12px}
.stat strong{color:var(--cyan);font-size:20px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
input,select,button{font:inherit;border-radius:10px;border:1px solid var(--line);padding:11px 14px}
input,select{background:#0e1524;color:white}input{flex:1;min-width:180px}
button{background:#17243a;color:white;cursor:pointer;transition:.15s}
button:hover{border-color:var(--cyan);transform:translateY(-1px)}
button.primary{background:var(--cyan);color:#061018;font-weight:800;border-color:var(--cyan)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.filters button.active{background:var(--purple);color:#0b0c16}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:16px}
.game{background:linear-gradient(145deg,#151e31,#0e1422);border:1px solid var(--line);border-radius:16px;padding:19px;min-height:200px;display:flex;flex-direction:column;gap:10px}
.game .emoji{font-size:35px}.game h3{margin:0;font-size:20px}.game p{color:var(--muted);margin:0;flex:1;line-height:1.5}
.tags{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px}.actions button:first-child{flex:1}
.star{font-size:20px}
#playArea{margin-top:28px}.playbox{background:#0e1524;border:1px solid var(--line);border-radius:18px;padding:20px;min-height:230px}
.playtop{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
#gameBody{padding:20px 0;text-align:center}
.big{font-size:42px;font-weight:900;margin:15px}
.gamebtn{font-size:18px;padding:14px 22px;margin:5px}
canvas{display:block;width:min(100%,520px);height:auto;background:#050912;border:1px solid var(--line);border-radius:12px;margin:15px auto;touch-action:manipulation}
.pad{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}footer{text-align:center;color:var(--muted);padding:35px 15px}
[hidden]{display:none!important}
@media(max-width:500px){main{padding:20px 13px}.hero{padding-top:12px}.game{min-height:185px}}
</style>
</head>
<body>
<header>
  <div class="logo">GAME<span>VAULT</span> ⚡</div>
  <p>Your arcade. Your rules. Play instantly.</p>
</header>
<main>
<section class="hero">
  <h1>ENTER THE <span>ARCADE.</span></h1>
  <p>Eight mini-games. Zero downloads. Pick your challenge and chase a new high score.</p>
  <div class="stats">
    <div class="stat"><strong>8</strong><br>Playable games</div>
    <div class="stat"><strong id="played">0</strong><br>Games launched</div>
    <div class="stat"><strong id="bestTotal">0</strong><br>Personal bests</div>
  </div>
  <button class="primary" onclick="surprise()">🎲 Surprise me</button>
</section>
<div class="controls">
  <input id="search" placeholder="🔎 Search games..." oninput="render()">
  <select id="sort" onchange="render()">
    <option value="default">Sort: Featured</option>
    <option value="az">Name: A–Z</option>
    <option value="best">Highest personal best</option>
  </select>
</div>
<div class="filters" id="filters">
  <button class="active" data-cat="All">All games</button>
  <button data-cat="Arcade">Arcade</button>
  <button data-cat="Action">Action</button>
  <button data-cat="Puzzle">Puzzle</button>
  <button data-cat="Racing">Racing</button>
  <button data-cat="Casual">Casual</button>
  <button data-cat="Favorites">⭐ Favorites</button>
</div>
<section class="grid" id="grid"></section>

<section id="playArea" hidden>
  <div class="playbox">
    <div class="playtop">
      <div><div class="muted" id="category"></div><h2 id="gameTitle">Game</h2></div>
      <button onclick="closeGame()">✕ Close game</button>
    </div>
    <div id="gameBody"></div>
  </div>
</section>
</main>
<footer>GAMEVAULT © 2026 · Built for players, by players ⚡</footer>
<script>
const games=[
{id:'reflex',name:'Neon Reflex',emoji:'⚡',cat:'Arcade',desc:'Test your reaction speed. Wait for green, then click as fast as you can.',tag:'Reaction'},
{id:'snake',name:'Neon Snake',emoji:'🐍',cat:'Arcade',desc:'Eat glowing dots, grow longer, and avoid crashing into yourself.',tag:'Classic'},
{id:'breakout',name:'Brick Breaker',emoji:'🧱',cat:'Arcade',desc:'Bounce the ball, smash the bricks, and clear the board.',tag:'Skill'},
{id:'memory',name:'Memory Matrix',emoji:'🧠',cat:'Puzzle',desc:'Flip cards and match every pair. Can you remember them all?',tag:'Brain'},
{id:'clicker',name:'Cozy Clicker',emoji:'🪙',cat:'Casual',desc:'Tap to earn coins and buy upgrades that boost every click.',tag:'Idle'},
{id:'ninja',name:'Number Ninja',emoji:'🥷',cat:'Puzzle',desc:'Solve quick math challenges before your 30 seconds run out.',tag:'Speed'},
{id:'racer',name:'Cyber Racer',emoji:'🏎️',cat:'Racing',desc:'Dodge traffic for as long as you can. One collision ends the run.',tag:'Endless'},
{id:'space',name:'Space Defender',emoji:'🚀',cat:'Action',desc:'Defend your ship from falling enemies. Move and fire to survive.',tag:'Shooter'}
];
let category='All',current=null,timers=[],state={},played=Number(localStorage.gvPlayed||0);
const $=id=>document.getElementById(id);
function best(id){return Number(localStorage['gvBest_'+id]||0)}
function saveBest(id,n){if(n>best(id))localStorage['gvBest_'+id]=Math.floor(n);updateStats()}
function updateStats(){$('played').textContent=played;$('bestTotal').textContent=games.filter(g=>best(g.id)>0).length}
function favorites(){try{return JSON.parse(localStorage.gvFav||'[]')}catch{return []}}
function toggleFav(id){let f=favorites();f=f.includes(id)?f.filter(x=>x!==id):[...f,id];localStorage.gvFav=JSON.stringify(f);render()}
$('filters').addEventListener('click',e=>{let b=e.target.closest('button[data-cat]');if(!b)return;category=b.dataset.cat;document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('active',x===b));render()});
function render(){
let list=games.filter(g=>(category==='All'||(category==='Favorites'?favorites().includes(g.id):g.cat===category))&&(g.name+' '+g.desc+' '+g.cat).toLowerCase().includes($('search').value.toLowerCase()));
if($('sort').value==='az')list.sort((a,b)=>a.name.localeCompare(b.name));
if($('sort').value==='best')list.sort((a,b)=>best(b.id)-best(a.id));
$('grid').innerHTML=list.map(g=>`<article class="game"><div class="emoji">${g.emoji}</div><div class="tags"><span>${g.cat} · ${g.tag}</span><span>🏆 ${best(g.id)}</span></div><h3>${g.name}</h3><p>${g.desc}</p><div class="actions"><button class="primary" onclick="launch('${g.id}')">▶ Play now</button><button class="star" title="Favorite" onclick="toggleFav('${g.id}')">${favorites().includes(g.id)?'⭐':'☆'}</button></div></article>`).join('');
if(!list.length)$('grid').innerHTML='<p class="muted">No games found. Try another search!</p>';
updateStats()
}
function clearTimers(){timers.forEach(clearInterval);timers.forEach(clearTimeout);timers=[]}
function later(fn,ms){let t=setTimeout(fn,ms);timers.push(t);return t}
function every(fn,ms){let t=setInterval(fn,ms);timers.push(t);return t}
function closeGame(){clearTimers();current=null;$('playArea').hidden=true;render()}
function launch(id){
clearTimers();current=id;state={};played++;localStorage.gvPlayed=played;
$('playArea').hidden=false;$('category').textContent=games.find(g=>g.id===id).cat.toUpperCase();$('gameTitle').textContent=games.find(g=>g.id===id).name;
$('gameBody').innerHTML='';$('playArea').scrollIntoView({behavior:'smooth',block:'start'});updateStats();
({reflex,snake,breakout,memory,clicker,ninja,racer,space})[id]()
}
function surprise(){launch(games[Math.floor(Math.random()*games.length)].id)}
function button(label,fn,cls='gamebtn'){let b=document.createElement('button');b.className=cls;b.textContent=label;b.onclick=fn;return b}
function text(s){let p=document.createElement('p');p.textContent=s;p.className='muted';$('gameBody').append(p);return p}
function big(s){let d=document.createElement('div');d.className='big';d.textContent=s;$('gameBody').append(d);return d}
function canvas(w,h){let c=document.createElement('canvas');c.width=w;c.height=h;$('gameBody').append(c);return [c,c.getContext('2d')]}
function reflex(){
text('Click start. When the panel turns green, click as quickly as possible. Five rounds!');
let b=button('Start round');$('gameBody').append(b);let info=big('Ready?');let round=0,total=0,go=false,start=0;
b.onclick=()=>{if(go){if(!state.active)return;let ms=Date.now()-start;total+=ms;round++;go=false;state.active=false;info.textContent=ms+' ms';b.textContent=round<5?'Next round':'Play again';if(round===5){let avg=Math.round(total/5);info.textContent='Average: '+avg+' ms';saveBest('reflex',Math.max(0,1000-avg));text('Lower reaction time is better!');b.textContent='Restart';round=0;total=0}return}
state.active=true;go=false;b.disabled=true;info.textContent='Wait for green…';info.style.color='#ff6688';
later(()=>{if(!state.active)return;go=true;start=Date.now();info.textContent='CLICK NOW!';info.style.color='#52f7ff';b.disabled=false;b.textContent='CLICK!'},700+Math.random()*2200);
b.disabled=true;let wait=timers[timers.length-1];}
b.onclick=()=>{if(state.active&&go){let ms=Date.now()-start;total+=ms;round++;state.active=false;go=false;info.style.color='white';if(round>=5){let avg=Math.round(total/5);info.textContent='Average '+avg+' ms';saveBest('reflex',Math.max(0,1000-avg));text('Score is based on reaction speed. Lower time is better.');round=0;total=0}else{info.textContent=ms+' ms · Round '+round+'/5'}b.textContent='Next round';b.disabled=false}else if(state.active&&!go){state.active=false;clearTimers();info.textContent='Too early! Try again.';b.textContent='Try again';b.disabled=false}else{state.active=true;b.disabled=true;info.textContent='Wait for green…';info.style.color='#ff6688';later(()=>{if(!state.active)return;go=true;start=Date.now();info.textContent='CLICK NOW!';info.style.color='#52f7ff';b.disabled=false;b.textContent='CLICK!'},700+Math.random()*2200)}}
}
function snake(){
text('Use arrow keys or WASD. On mobile, use the direction buttons.');
let [c,x]=canvas(360,360);let size=18,body=[{x:9,y:9},{x:8,y:9},{x:7,y:9}],dir={x:1,y:0},food={x:14,y:9},score=0,dead=false;
let scoreEl=big('Score: 0');
function place(){food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}}
function draw(){x.fillStyle='#050912';x.fillRect(0,0,360,360);x.fillStyle='#ffda6b';x.fillRect(food.x*size,food.y*size,size-2,size-2);x.fillStyle='#52f7ff';body.forEach(p=>x.fillRect(p.x*size,p.y*size,size-2,size-2))}
function step(){if(dead)return;let h={x:body[0].x+dir.x,y:body[0].y+dir.y};if(h.x<0||h.y<0||h.x>=20||h.y>=20||body.some(p=>p.x===h.x&&p.y===h.y)){dead=true;saveBest('snake',score);text('Game over! Final score: '+score);return}body.unshift(h);if(h.x===food.x&&h.y===food.y){score++;scoreEl.textContent='Score: '+score;place()}else body.pop();draw()}
function turn(dx,dy){if(dx!==-dir.x||dy!==-dir.y)dir={x:dx,y:dy}}
state.key=e=>{let k=e.key.toLowerCase();if(k==='arrowup'||k==='w')turn(0,-1);if(k==='arrowdown'||k==='s')turn(0,1);if(k==='arrowleft'||k==='a')turn(-1,0);if(k==='arrowright'||k==='d')turn(1,0)};
window.addEventListener('keydown',state.key);timers.push(setInterval(()=>window.removeEventListener('keydown',state.key),86400000));every(step,135);
let pad=document.createElement('div');pad.className='pad';[['↑',0,-1],['←',-1,0],['↓',0,1],['→',1,0]].forEach(([s,dx,dy])=>pad.append(button(s,()=>turn(dx,dy))));$('gameBody').append(pad);draw()
}
function breakout(){
text('Move with ← → or A/D, or use the buttons. Clear the bricks!');
let [c,x]=canvas(420,300),p=170,b={x:210,y:240,dx:3,dy:-3},bricks=[],score=0,done=false;
for(let r=0;r<4;r++)for(let col=0;col<8;col++)bricks.push({x:10+col*50,y:18+r*24,on:true});
let scoreEl=big('Bricks: 0');
function draw(){x.fillStyle='#050912';x.fillRect(0,0,420,300);bricks.forEach((q,i)=>{if(q.on){x.fillStyle=['#52f7ff','#a78bfa','#ff7bba','#ffda6b'][Math.floor(i/8)];x.fillRect(q.x,q.y,44,16)}});x.fillStyle='white';x.fillRect(p,278,80,9);x.beginPath();x.arc(b.x,b.y,6,0,Math.PI*2);x.fill()}
function step(){if(done)return;b.x+=b.dx;b.y+=b.dy;if(b.x<6||b.x>414)b.dx*=-1;if(b.y<6)b.dy*=-1;if(b.y>270&&b.x>p&&b.x<p+80)b.dy=-Math.abs(b.dy);if(b.y>300){done=true;text('Ball lost! Score: '+score);saveBest('breakout',score);return}
bricks.forEach(q=>{if(q.on&&b.x>q.x&&b.x<q.x+44&&b.y>q.y&&b.y<q.y+16){q.on=false;b.dy*=-1;score++;scoreEl.textContent='Bricks: '+score}});
if(score===32){done=true;text('Board cleared!');saveBest('breakout',score)}draw()}
function move(d){p=Math.max(0,Math.min(340,p+d))}
state.key=e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-22);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(22)};window.addEventListener('keydown',state.key);every(step,25);
let pad=document.createElement('div');pad.className='pad';pad.append(button('⬅ Move',()=>move(-30)),button('Move ➡',()=>move(30)));$('gameBody').append(pad);draw()
}
function memory(){
text('Flip two cards at a time and match all eight pairs.');
let vals=['🚀','👾','💎','⚡','🪐','🎮','🤖','🌟'],deck=[...vals,...vals].sort(()=>Math.random()-.5),open=[],matched=[],moves=0;
let info=big('Moves: 0'),grid=document.createElement('div');grid.style.cssText='display:grid;grid-template-columns:repeat(4,minmax(48px,75px));gap:8px;justify-content:center';$('gameBody').append(grid);
function draw(){grid.innerHTML='';deck.forEach((v,i)=>{let b=button(matched.includes(i)||open.includes(i)?v:'?',()=>flip(i));b.style.cssText='height:65px;font-size:25px;padding:4px';b.disabled=matched.includes(i)||open.includes(i);grid.append(b)})}
function flip(i){if(open.length===2||open.includes(i)||matched.includes(i))return;open.push(i);draw();if(open.length===2){moves++;info.textContent='Moves: '+moves;let pair=[...open];if(deck[pair[0]]===deck[pair[1]]){matched.push(...pair);open=[];draw();if(matched.length===16){text('All matched in '+moves+' moves!');saveBest('memory',Math.max(1,100-moves))}}else later(()=>{open=[];draw()},700)}}
draw()
}
function clicker(){
let coins=0,level=1,cost=10;let info=big('🪙 Coins: 0');let sub=text('Upgrade cost: 10 coins · Each click earns 1 coin.');
let tap=button('🪙 TAP TO EARN',()=>{coins+=level;info.textContent='🪙 Coins: '+coins;sub.textContent='Upgrade cost: '+cost+' coins · Each click earns '+level+'.'},'gamebtn primary');
let up=button('⬆ Buy upgrade',()=>{if(coins>=cost){coins-=cost;level++;cost=Math.ceil(cost*1.7);info.textContent='🪙 Coins: '+coins;sub.textContent='Upgrade cost: '+cost+' coins · Each click earns '+level+'.'}else sub.textContent='Not enough coins yet — keep tapping!'});
$('gameBody').append(tap,up);let score=0;let end=button('Finish & save score',()=>saveBest('clicker',coins));$('gameBody').append(end)
}
function ninja(){
text('Solve as many as you can in 30 seconds.');let score=0,left=30,answer=0;
let timer=big('30 seconds'),question=big('Ready?'),input=document.createElement('input');input.type='number';input.placeholder='Your answer';input.style.maxWidth='180px';
let go=button('Start',start,'gamebtn primary');$('gameBody').append(input,go);
function next(){let a=Math.floor(Math.random()*15)+1,b=Math.floor(Math.random()*15)+1,op=Math.random()<.5?'+':'−';if(op==='−'&&b>a)[a,b]=[b,a];answer=op==='+'?a+b:a-b;question.textContent=a+' '+op+' '+b+' = ?';input.value=''}
function start(){score=0;left=30;go.disabled=true;input.disabled=false;next();every(()=>{left--;timer.textContent=left+' seconds';if(left<=0){clearTimers();go.disabled=false;input.disabled=true;go.textContent='Play again';question.textContent='Time! Score: '+score;saveBest('ninja',score)}},1000)}
function submit(){if(go.disabled&&input.value!==''&&Number(input.value)===answer){score++;next();timer.textContent=left+' seconds · Score '+score}}
input.addEventListener('input',submit);input.addEventListener('keydown',e=>{if(e.key==='Enter')submit()})
}
function racer(){
text('Move left or right to dodge incoming traffic. Arrow keys or buttons work.');
let [c,x]=canvas(300,360),lane=1,obs=[],score=0,dead=false,frame=0;let info=big('Distance: 0');
function draw(){x.fillStyle='#101827';x.fillRect(0,0,300,360);x.strokeStyle='#59657c';x.setLineDash([14,12]);x.beginPath();x.moveTo(100,0);x.lineTo(100,360);x.moveTo(200,0);x.lineTo(200,360);x.stroke();x.setLineDash([]);x.fillStyle='#52f7ff';x.fillRect(20+lane*100,300,60,42);obs.forEach(o=>{x.fillStyle='#ff6487';x.fillRect(20+o.lane*100,o.y,60,42)})}
function step(){if(dead)return;frame++;if(frame%34===0)obs.push({lane:Math.floor(Math.random()*3),y:-45});obs.forEach(o=>o.y+=4);obs=obs.filter(o=>o.y<380);if(obs.some(o=>o.lane===lane&&o.y>265&&o.y<340)){dead=true;text('Crash! Distance: '+score);saveBest('racer',score);return}score++;info.textContent='Distance: '+score;draw()}
function move(d){lane=Math.max(0,Math.min(2,lane+d));draw()}
state.key=e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1)};window.addEventListener('keydown',state.key);every(step,45);
let pad=document.createElement('div');pad.className='pad';pad.append(button('⬅ Left',()=>move(-1)),button('Right ➡',()=>move(1)));$('gameBody').append(pad);draw()
}
function space(){
text('Move left/right and shoot. Keyboard: arrows or A/D + Space. On mobile, use the buttons.');
let [c,x]=canvas(360,360),px=180,shots=[],enemies=[],score=0,frame=0,dead=false;let info=big('Score: 0'),fire=false;
function shoot(){if(!dead)shots.push({x:px+15,y:300})}
function draw(){x.fillStyle='#050912';x.fillRect(0,0,360,360);for(let i=0;i<35;i++){x.fillStyle='#7788aa';x.fillRect((i*71)%360,(i*43+frame*2)%360,2,2)}x.fillStyle='#52f7ff';x.fillRect(px,320,30,20);x.fillStyle='#ffda6b';shots.forEach(s=>x.fillRect(s.x,s.y,4,12));x.fillStyle='#ff6688';enemies.forEach(e=>x.fillRect(e.x,e.y,23,20))}
function step(){if(dead)return;frame++;if(frame%32===0)enemies.push({x:Math.random()*330,y:-20});shots.forEach(s=>s.y-=7);enemies.forEach(e=>e.y+=2);shots=shots.filter(s=>s.y>0);enemies=enemies.filter(e=>e.y<370);enemies.forEach(e=>shots.forEach(s=>{if(!e.dead&&s.x>e.x&&s.x<e.x+23&&s.y<e.y+20&&s.y>e.y){e.dead=true;s.y=-30;score++}}));enemies=enemies.filter(e=>!e.dead);if(enemies.some(e=>e.y>300&&e.x<px+30&&e.x+23>px)){dead=true;text('Ship hit! Final score: '+score);saveBest('space',score);return}info.textContent='Score: '+score;draw()}
function move(d){px=Math.max(0,Math.min(330,px+d));draw()}
state.key=e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-15);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(15);if(e.code==='Space'){e.preventDefault();shoot()}};window.addEventListener('keydown',state.key);every(step,35);
let pad=document.createElement('div');pad.className='pad';pad.append(button('⬅',()=>move(-20)),button('🚀 FIRE',shoot,'gamebtn primary'),button('➡',()=>move(20)));$('gameBody').append(pad);draw()
}
render();updateStats();
</script>
</body>
</html>
